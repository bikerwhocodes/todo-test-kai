# Local development database for NextUp.
# Port 55433 is deliberately non-default so this never collides with a
# system Postgres. Credentials come from .env.local, which is generated by
# `npm run env:init` and is git-ignored — no value is committed to this repo.
#
# NEXTUP_DB_PORT and COMPOSE_PROJECT_NAME are overridable because the compose
# project name defaults to the checkout's directory name: two clones of this
# repository on one machine both resolve to "todo-test-kai" and then fight over
# one container, each seeing the other's superuser password. Set both in
# .env.local for a second checkout. Defaults are unchanged for the usual case.
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "npm run env:init" first}
      POSTGRES_DB: nextup
    ports:
      - "127.0.0.1:${NEXTUP_DB_PORT:-55433}:5432"
    volumes:
      - nextup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextup"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nextup-pgdata:
